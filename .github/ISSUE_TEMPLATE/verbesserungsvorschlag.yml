name: Verbesserungsvorschlag
description: Eine Korrektur oder Idee für unseren Wettbewerbsbeitrag einreichen.
title: "[Vorschlag] Website Feuerwehr der Zukunft"
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Rückmeldung! Bitte nenne deinen Namen und beschreibe, was wir an der Website ändern oder ergänzen sollen.

        **Name und Vorschlag sind öffentlich sichtbar.** Sie werden in die herunterladbare Textsammlung aufgenommen. Bitte trage keine vertraulichen Angaben ein. Die Sammlung erfolgt ohne KI-Auswertung.
  - type: input
    id: name
    attributes:
      label: Dein Name
      placeholder: Vorname Nachname
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Dein Verbesserungsvorschlag
      description: Nenne möglichst den Abschnitt der Website und die gewünschte Änderung.
      placeholder: Was sollen wir ändern oder ergänzen?
    validations:
      required: true
